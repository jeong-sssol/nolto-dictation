<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 모드 - 놀토 받쓰</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=30">
</head>
<body class="teacher-bg">
    <header class="teacher-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; flex-wrap:wrap; gap:10px;">
        <div style="display:flex; align-items:center; gap:15px;">
            <h1 style="margin:0;">👩‍🏫 실시간 모니터링</h1>
            <button onclick="toggleSetupModal()" style="background:#34495e; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:1.1rem;">⚙️ 기본 세팅</button>
        </div>
        
        <div style="display:flex; align-items:center; gap:20px;">
            <div style="font-size: 1.2rem; font-weight: bold; color:#f1c40f;">
                진행 라운드: <select id="active-round-select" class="wide-dropdown" style="width: 100px; font-weight:bold; font-size:1.1rem; margin-right:15px;" onchange="changeActiveRound()"></select>
            </div>
            
            <div style="display: flex; gap: 5px; align-items: center; background:rgba(0,0,0,0.3); padding:5px 15px; border-radius:10px;">
                <span style="font-size:1.1rem; font-weight:bold;">⏱️ 타이머</span>
                <input type="number" id="timer-min" value="0" min="0" style="width: 60px; font-size:1.3rem; text-align:center;"> 분
                <input type="number" id="timer-sec" value="0" min="0" max="59" style="width: 60px; font-size:1.3rem; text-align:center;"> 초
                <button onclick="startTimer()" style="background: #27ae60; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold;">▶ 시작</button>
                <button onclick="App.stopTimer()" style="background: #7f8c8d; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold;">⏹ 정지</button>
            </div>

            <button id="btn-lock" onclick="toggleLock()" style="padding: 8px 15px; font-size:1.1rem; font-weight:bold; border:none; border-radius:5px; cursor:pointer;"></button>
            <button onclick="toggleSidebar()" style="background: #e67e22; border: none; padding:8px 15px; border-radius:5px; font-size: 1.2rem; cursor: pointer; color:white; font-weight:bold;">🧰 진행 도구</button>
        </div>
    </header>

    <div id="teacher-timer-bar" style="background:#e74c3c; color:white; text-align:center; padding:5px; font-size:1.5rem; font-weight:bold; display:none;">
        남은 시간: <span id="teacher-timer-display">00:00</span>
    </div>

    <!-- 🌟 우측 하단 힌트 주문 알림 -->
    <button class="hint-fab" onclick="toggleActionPanel()">
        🔔 <span id="hint-badge" class="hint-badge hidden">0</span>
    </button>

    <div id="action-pos-panel" class="hint-panel hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #16a085; padding-bottom:10px; margin-bottom:10px;">
            <div style="font-size: 1.3rem; font-weight: bold;">🛎️ 힌트 요청 내역</div>
            <button onclick="toggleActionPanel()" style="background:transparent; border:none; color:white; font-size:1.5rem; cursor:pointer;">❌</button>
        </div>
        <div id="hint-list" style="display:flex; flex-direction:column; gap:8px; max-height:400px; overflow-y:auto; margin-bottom:5px;"></div>
    </div>

    <!-- 🌟 우측 슬라이드 사이드바 -->
    <div id="teacher-sidebar" class="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>🛠️ 수업 진행 도구</h2>
            <button onclick="toggleSidebar()" style="background:transparent; border:none; font-size:2rem; cursor:pointer;">❌</button>
        </div>

        <div class="sidebar-section">
            <h3 style="color:#8e44ad;">🎵 전광판 오디오 컨트롤</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button onclick="App.triggerAudio('intro_then_answer')" style="background:#8e44ad; color:white;">🎵 인트로 ➔ 정답(321) 연속 재생</button>
                <button onclick="App.triggerAudio('answer')" style="background:#2980b9; color:white;">🎵 정답(321)만 재생</button>
                <button onclick="App.triggerAudio('stop')" style="background:#7f8c8d; color:white;">⏹ 음악 정지</button>
            </div>
        </div>

        <div class="sidebar-section">
            <h3 style="color:#f39c12;">🌟 TV 전광판 정답 공개</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <button onclick="App.triggerAudio('answer_and_reveal')" style="background:#f39c12; color:white; font-weight:bold;">🌟 정답(321) + 촤라락 자동 공개</button>
                <button onclick="App.triggerHideAll()" style="background:#34495e; color:white;">⬇️ 전광판 글자 모두 덮기 (숨기기)</button>
            </div>
            
            <div style="margin-top:15px; display:flex; align-items:center; gap:5px;">
                <label style="font-weight:bold; font-size:1.1rem;">⚡ 촤라락 속도 (초): </label>
                <!-- 🌟 정밀한 입력을 위해 슬라이더에서 텍스트 입력창으로 변경 -->
                <input type="number" id="reveal-speed" min="0.01" max="2.0" step="0.01" value="0.2" class="time-input" onchange="App.saveSettingsOnly();" style="width:70px;">
            </div>
        </div>

        <div class="sidebar-section">
            <h3 style="color:#e74c3c;">🎉 리액션 (TV송출)</h3>
            <div id="effect-checkboxes" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:1.2rem; margin-bottom: 10px;"></div>
            <div style="display:flex; gap:10px;">
                <button onclick="triggerEffect('boom')" style="background:#e74c3c; color:white; flex:1;">🍿 오답 강냉이</button>
                <button onclick="triggerEffect('oneshot')" style="background:#3498db; color:white; flex:1;">📸 원샷 송출</button>
            </div>
        </div>
        
        <div class="sidebar-section">
            <h3 style="color:#27ae60;">💡 힌트 및 칠판 제어</h3>
            
            <!-- 🌟 힌트 시간 및 횟수 설정부 통합 -->
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <label style="font-weight:bold;">모둠별 힌트 횟수:</label>
                <div><input type="number" id="set-hint-limit" value="1" min="1" max="10" style="width:50px; text-align:center;" onchange="App.saveSettingsOnly()"> 회</div>
            </div>
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <label style="font-weight:bold;">힌트 오픈 시간:</label>
                <div><input type="number" id="set-hint-duration" value="3" min="1" max="10" style="width:50px; text-align:center;" onchange="App.saveSettingsOnly()"> 초</div>
            </div>

            <button onclick="executeAddHint()" style="background:#8e44ad; color:white; width:100%; margin-bottom:15px; font-weight:bold;">💡 이번 라운드 힌트 기회 +1 추가</button>

            <label style="display:block; margin-bottom:5px;">CCTV 글자 크기: <span id="font-size-val"></span>px</label>
            <input type="range" id="cctv-font-size" min="15" max="60" value="30" onchange="App.saveSettingsOnly(); renderCCTV();" style="width:100%; margin-bottom:15px;">

            <button onclick="executeClearAll()" style="background: #e67e22; color:white; width:100%;">🧽 전체 받쓰판 지우기 (+힌트리셋)</button>
        </div>
    </div>
    <div id="sidebar-overlay" class="sidebar-overlay hidden" onclick="toggleSidebar()"></div>

    <div id="setup-modal" class="modal hidden">
        <div class="modal-content" style="width: 800px; max-height:90vh; overflow-y:auto; text-align:left;">
            <h2 style="color: #1976d2; text-align:center;">⚙️ 기초 & 노래 구간 세팅</h2>
            <div class="setting-row" style="background:#f4f1ea; padding:15px; border-radius:10px; justify-content:space-around;">
                <label>비밀번호: <input type="text" id="set-admin-pw" style="width:150px;"></label>
                <label>모둠 수: <input type="number" id="set-groups" min="1" max="10" style="width:60px;" onchange="renderDynamicInputs()"></label>
                <label>총 라운드: <input type="number" id="set-total-rounds" min="1" max="10" style="width:60px;" onchange="renderDynamicInputs()"></label>
            </div>

            <h3 style="margin-top:15px; color:#27ae60;">🎵 라운드별 정답 & 노래 구간 세팅</h3>
            <p style="font-size:0.9rem; color:#555;">(※ 정답에 슬래시(/)를 넣으면 수동 줄바꿈됩니다. TV는 이 설정을 자동으로 불러옵니다.)</p>
            <div id="answers-container" style="display:flex; flex-direction:column; gap:15px; width:100%;"></div>

            <h3 style="margin-top:15px; color:#e67e22;">모둠별 비밀번호</h3>
            <div id="group-pw-container" class="setting-row" style="flex-wrap: wrap; justify-content:center;"></div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="saveModalSettings()" style="background:#27ae60; flex:1;">저장 후 닫기</button>
                <button onclick="toggleSetupModal()" style="background:#95a5a6; flex:1;">취소</button>
            </div>
            
            <button onclick="resetAllData()" style="width:100%; margin-top:20px; background:#e74c3c;">🚨 모든 데이터 리셋 (새수업)</button>
        </div>
    </div>

    <div class="cctv-grid" id="cctv-container"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/app.js?v=30"></script>

    <script>
        const cctvContainer = document.getElementById('cctv-container');
        let unreadHints = 0;
        let teacherTimerInterval = null;

        window.onload = () => {
            const settings = App.getSettings();
            document.getElementById('set-admin-pw').value = settings.adminPassword || '1234';
            document.getElementById('set-groups').value = settings.groupCount;
            document.getElementById('set-total-rounds').value = settings.totalRounds || 3;
            document.getElementById('set-hint-limit').value = settings.hintLimit || 1;
            document.getElementById('cctv-font-size').value = settings.teacherFontSize || 30;
            if(settings.revealSpeed) document.getElementById('reveal-speed').value = settings.revealSpeed;
            if(settings.hintDuration) document.getElementById('set-hint-duration').value = settings.hintDuration;
            
            renderDynamicInputs(settings.passwords, settings.answers, settings.timings);
            updateDashboardControls();
            renderCCTV();
            setInterval(checkHintTimeout, 5000); 
        };

        function toggleSidebar() {
            document.getElementById('teacher-sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function toggleSetupModal() {
            document.getElementById('setup-modal').classList.toggle('hidden');
        }

        function toggleActionPanel() {
            document.getElementById('action-pos-panel').classList.toggle('hidden');
        }

        function renderDynamicInputs(existingPws = {}, existingAns = {}, existingTimings = {}) {
            const groupCount = parseInt(document.getElementById('set-groups').value);
            const roundCount = parseInt(document.getElementById('set-total-rounds').value);
            
            const pwContainer = document.getElementById('group-pw-container');
            let pwHtml = '';
            for(let i=1; i<=groupCount; i++) {
                pwHtml += `<label style="margin:5px;">${i}조: <input type="text" id="pw-${i}" value="${existingPws[i]||''}" style="width:65px; padding:5px;"></label>`;
            }
            pwContainer.innerHTML = pwHtml;

            const ansContainer = document.getElementById('answers-container');
            let ansHtml = '';
            for(let i=1; i<=roundCount; i++) {
                const t = existingTimings[i] || {iSM:0, iSS:0, iEM:0, iES:0, aSM:0, aSS:0, aEM:0, aES:0};
                ansHtml += `
                    <div style="background:#fff; padding:10px; border-radius:5px; border:1px solid #ccc;">
                        <strong>${i}R 정답:</strong> <input type="text" id="ans-${i}" value="${existingAns[i]||''}" style="width:80%; padding:5px; margin-bottom:5px;"><br>
                        <span style="font-size:1rem; color:#555; display:inline-block; margin-top:5px;">
                            <strong style="display:inline-block; width:55px;">인트로:</strong> 
                            <input type="number" id="t-i-s-m-${i}" value="${t.iSM||''}" class="time-input">분 <input type="number" id="t-i-s-s-${i}" value="${t.iSS||''}" class="time-input" step="0.01" min="0" max="59.99">초 ~ 
                            <input type="number" id="t-i-e-m-${i}" value="${t.iEM||''}" class="time-input">분 <input type="number" id="t-i-e-s-${i}" value="${t.iES||''}" class="time-input" step="0.01" min="0" max="59.99">초 <br>
                            <strong style="display:inline-block; width:55px;">정답:</strong> 
                            <input type="number" id="t-a-s-m-${i}" value="${t.aSM||''}" class="time-input">분 <input type="number" id="t-a-s-s-${i}" value="${t.aSS||''}" class="time-input" step="0.01" min="0" max="59.99">초 ~ 
                            <input type="number" id="t-a-e-m-${i}" value="${t.aEM||''}" class="time-input">분 <input type="number" id="t-a-e-s-${i}" value="${t.aES||''}" class="time-input" step="0.01" min="0" max="59.99">초
                        </span>
                    </div>
                `;
            }
            ansContainer.innerHTML = ansHtml;

            const effContainer = document.getElementById('effect-checkboxes');
            let effHtml = '';
            for(let i=1; i<=groupCount; i++) {
                effHtml += `<label style="cursor:pointer; white-space:nowrap; padding:5px; background:#f4f1ea; border-radius:5px;"><input type="checkbox" name="eff-group" value="${i}" style="transform:scale(1.3); margin-right:5px;"> ${i}조</label>`;
            }
            effContainer.innerHTML = effHtml;
        }

        function saveModalSettings() {
            try {
                const adminPw = document.getElementById('set-admin-pw').value;
                const groupCount = parseInt(document.getElementById('set-groups').value);
                const totalRounds = parseInt(document.getElementById('set-total-rounds').value);
                const hintLimit = parseInt(document.getElementById('set-hint-limit').value) || 1;
                const tFontSize = document.getElementById('cctv-font-size').value;
                
                let passwords = {};
                for(let i=1; i<=groupCount; i++) passwords[i] = document.getElementById(`pw-${i}`).value;
                
                let answers = {};
                let timings = {};
                for(let i=1; i<=totalRounds; i++) {
                    answers[i] = document.getElementById(`ans-${i}`).value;
                    timings[i] = {
                        iSM: parseInt(document.getElementById(`t-i-s-m-${i}`).value) || 0,
                        iSS: parseFloat(document.getElementById(`t-i-s-s-${i}`).value) || 0,
                        iEM: parseInt(document.getElementById(`t-i-e-m-${i}`).value) || 0,
                        iES: parseFloat(document.getElementById(`t-i-e-s-${i}`).value) || 0,
                        aSM: parseInt(document.getElementById(`t-a-s-m-${i}`).value) || 0,
                        aSS: parseFloat(document.getElementById(`t-a-s-s-${i}`).value) || 0,
                        aEM: parseInt(document.getElementById(`t-a-e-m-${i}`).value) || 0,
                        aES: parseFloat(document.getElementById(`t-a-e-s-${i}`).value) || 0
                    };
                }
                
                App.saveSettings(adminPw, groupCount, passwords, totalRounds, answers, timings, hintLimit, tFontSize);
                alert("초기 설정이 저장되었습니다. TV 전광판에도 즉시 반영됩니다!");
                toggleSetupModal();
                updateDashboardControls();
                renderCCTV();
            } catch(e) {
                console.error(e);
                alert("저장 중 오류가 발생했습니다. 모든 칸이 올바르게 채워졌는지 확인해주세요.");
            }
        }

        function resetAllData() {
            if(confirm("모든 모둠 데이터와 설정이 초기화됩니다. 계속할까요?")) {
                App.factoryReset();
                setTimeout(() => location.reload(), 500);
            }
        }

        function executeClearAll() {
            if(confirm('학생 칠판 지우기 및 힌트 사용내역을 모두 초기화하시겠습니까?')) {
                App.clearBoardsAndHints(); 
                alert('초기화되었습니다.');
            }
        }

        function updateDashboardControls() {
            const settings = App.getSettings();
            const roundSelect = document.getElementById('active-round-select');
            roundSelect.innerHTML = '';
            for(let i=1; i<=settings.totalRounds; i++) {
                roundSelect.innerHTML += `<option value="${i}">${i} 라운드 채점</option>`;
            }
            roundSelect.value = settings.currentRound;

            const btnLock = document.getElementById('btn-lock');
            if (settings.isLocked) {
                btnLock.innerText = '🔒 받쓰판 잠금 해제';
                btnLock.style.background = '#d32f2f';
                btnLock.style.color = 'white';
            } else {
                btnLock.innerText = '🔓 받쓰판 강제 잠금';
                btnLock.style.background = '#f1c40f';
                btnLock.style.color = 'black';
            }

            document.getElementById('set-hint-limit').value = settings.hintLimit || 1;
            document.getElementById('cctv-font-size').value = settings.teacherFontSize || 30;
            if(settings.revealSpeed) {
                document.getElementById('reveal-speed').value = settings.revealSpeed;
            }
            if(settings.hintDuration) {
                document.getElementById('set-hint-duration').value = settings.hintDuration;
            }

            renderDynamicInputs(settings.passwords, settings.answers, settings.timings); 
            manageTeacherTimer(settings);
        }

        function changeActiveRound() {
            App.setCurrentRound(parseInt(document.getElementById('active-round-select').value));
        }

        function toggleLock() {
            App.setLock(!App.getSettings().isLocked);
        }

        function startTimer() {
            const m = parseInt(document.getElementById('timer-min').value) || 0;
            const s = parseInt(document.getElementById('timer-sec').value) || 0;
            const totalSec = (m * 60) + s;
            if (totalSec > 0) App.startTimer(totalSec);
            else alert("시간을 설정해주세요.");
        }

        function manageTeacherTimer(settings) {
            clearInterval(teacherTimerInterval);
            const bar = document.getElementById('teacher-timer-bar');
            const display = document.getElementById('teacher-timer-display');

            if (settings.timerEnd) {
                bar.style.display = 'block';
                teacherTimerInterval = setInterval(() => {
                    const left = Math.floor((settings.timerEnd - Date.now()) / 1000);
                    if (left <= 0) {
                        display.innerText = "00:00";
                        bar.style.background = "#c0392b";
                        clearInterval(teacherTimerInterval);
                    } else {
                        bar.style.background = "#e74c3c";
                        const m = String(Math.floor(left / 60)).padStart(2, '0');
                        const s = String(left % 60).padStart(2, '0');
                        display.innerText = `${m}:${s}`;
                    }
                }, 500);
            } else {
                bar.style.display = 'none';
            }
        }

        function triggerEffect(type) {
            const checkboxes = document.querySelectorAll('input[name="eff-group"]:checked');
            if(checkboxes.length === 0) return alert("대상을 선택해주세요.");
            const targets = Array.from(checkboxes).map(cb => parseInt(cb.value));
            App.triggerEffect(type, targets);
            alert(`이벤트 전송 완료!`);
            checkboxes.forEach(cb => cb.checked = false);
            toggleSidebar(); 
        }

        function executeAddHint() {
            const limitInput = document.getElementById('set-hint-limit');
            let currentLimit = parseInt(limitInput.value) || 0;
            limitInput.value = currentLimit + 1;
            App.saveSettingsOnly();
            alert(`모든 조의 힌트 제한이 ${currentLimit + 1}회로 늘어났습니다!`);
        }

        function cancelTeacherHint(reqId) {
            if(confirm("이 힌트 요청을 거절(취소)하시겠습니까?\n학생의 힌트 차감 횟수가 복구됩니다.")) {
                App.cancelHint(reqId);
            }
        }

        function renderHintQueue() {
            const hints = App.getHintRequests();
            const list = document.getElementById('hint-list');
            const badge = document.getElementById('hint-badge');
            
            let pendingCount = 0;
            list.innerHTML = '';

            for(let key in hints) {
                if (hints[key].status === 'pending') {
                    pendingCount++;
                    const secs = Math.floor((Date.now() - hints[key].ts) / 1000);
                    const timeColor = secs > 60 ? '#e74c3c' : '#bdc3c7';
                    const paramText = hints[key].param ? ` (${hints[key].param})` : '';
                    
                    list.innerHTML += `
                        <div style="background: rgba(0,0,0,0.3); padding: 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; gap:10px;">
                            <div style="font-size:1.1rem; text-align:left;">
                                <strong>${hints[key].group}조</strong> [${hints[key].type}${paramText}] 
                                <br><span style="font-size:0.9rem; color:${timeColor}; margin-left:5px;">(${secs}초전)</span>
                            </div>
                            <div style="display:flex; gap:5px;">
                                <button onclick="App.processHint('${key}', 'approved'); toggleActionPanel(); alert('힌트 승인 완료!');" style="background:#2ecc71; color:white; border:none; padding:10px 15px; border-radius:5px; cursor:pointer; font-weight:bold; white-space:nowrap;">✅ 승인</button>
                                <button onclick="cancelTeacherHint('${key}'); toggleActionPanel();" style="background:#e74c3c; color:white; border:none; padding:10px 15px; border-radius:5px; cursor:pointer; font-weight:bold; white-space:nowrap;">❌ 거절</button>
                            </div>
                        </div>
                    `;
                }
            }

            badge.innerText = pendingCount;
            if(pendingCount > 0) {
                badge.classList.remove('hidden');
                if(pendingCount > unreadHints) document.getElementById('action-pos-panel').classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
                if(list.innerHTML === '') list.innerHTML = '<div style="text-align:center; color:#ccc;">대기 중인 힌트가 없습니다.</div>';
            }
            unreadHints = pendingCount;
        }

        function checkHintTimeout() {
            const hints = App.getHintRequests();
            const now = Date.now();
            for(let key in hints) {
                if(hints[key].status === 'pending' && (now - hints[key].ts > 60000) && !hints[key].alerted) {
                    alert(`🚨 [${hints[key].group}모둠] 힌트 주문이 1분 이상 지연되었습니다!`);
                    App.markHintAlerted(key);
                }
            }
        }

        window.addEventListener('app-sync', () => {
            updateDashboardControls();
            renderCCTV();
            renderHintQueue();
        });

        function renderCCTV() {
            const settings = App.getSettings();
            const groups = App.getAllGroups();
            const tFontSize = settings.teacherFontSize || 30; 
            const currentAnsRaw = settings.answers[settings.currentRound] || '';
            const currentAns = currentAnsRaw.replace(/\//g, '');
            
            document.getElementById('font-size-val').innerText = tFontSize;
            cctvContainer.innerHTML = '';

            for (let i = 1; i <= settings.groupCount; i++) {
                const gData = groups[i] || { master: '', membersData: {}, customName: '', hintCount:0, members: [] };
                const masterName = gData.master;
                const mData = gData.membersData[masterName] || { type: 'pen', data: '', color: '#ffffff' };
                const hintUsedText = gData.hintCount > 0 ? ` (💡${gData.hintCount}회)` : '';
                
                const grade = App.gradeAnswer(currentAns, mData.data);
                
                let boardContent = '';
                if (mData.type === 'text') {
                    boardContent = `<div class="board-text-overlay" style="font-size:${tFontSize}px; color:${mData.color || '#fff'}; word-break: break-all; white-space: pre-wrap;">${mData.data}</div>`;
                } else if (mData.data) {
                    boardContent = `<img src="${mData.data}" style="width:100%; height:100%; object-fit:contain;">`;
                }

                const customNameDisplay = gData.customName ? ` <span style="color:#e67e22">[${gData.customName}]</span>` : '';

                let masterOptions = `<option value="">방장 없음</option>`;
                if(gData.members) {
                    gData.members.forEach(m => {
                        masterOptions += `<option value="${m}" ${m===masterName?'selected':''}>${m}</option>`;
                    });
                }
                const masterSelectHtml = `<select onchange="App.setMaster('${i}', this.value)" style="font-size:0.9rem; padding:2px; border-radius:3px; background:#f1c40f; font-weight:bold; border:none; outline:none; cursor:pointer; margin-left:5px;">${masterOptions}</select>`;

                cctvContainer.innerHTML += `
                    <div class="cctv-card">
                        <h3 style="margin:5px 0;">${i} 조${customNameDisplay}${hintUsedText} <span style="font-size:1.1rem; color:#d32f2f;">(방장: ${masterSelectHtml})</span></h3>
                        <div class="cctv-board">${boardContent}</div>
                        <div class="correct-rate" style="color: ${grade.rate === 100 ? '#27ae60' : '#d32f2f'}">
                            ${currentAns ? `정답률: ${grade.rate}% (${grade.correctCount}/${grade.totalCount})` : '정답 미입력 (자동채점 대기)'}
                        </div>
                        <div style="font-size:1.2rem; font-weight:bold; margin-top:5px; word-break: break-all; white-space: pre-wrap;">${grade.html}</div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
