<body class="main-bg">
    <div class="main-container">
        <h1 class="main-title">🎵 놀라운 토요일 <span>역사 받쓰판</span> 📝</h1>
        <div class="grid-menu">
            <div class="card student-card" onclick="location.href='student.html'">
                <h2>🎓 학생 입장</h2>
                <p>받쓰 & 힌트 요청</p>
            </div>
            <!-- 🌟 암호화된 교사모드 주소로 연결 -->
            <div class="card teacher-card" onclick="checkTeacher('teacher_rhksflwkzhsthf1234.html')">
                <h2>👩‍🏫 교사 모드</h2>
                <p>모니터링 & 컨트롤</p>
            </div>
            <div class="card tv-card" onclick="checkTeacher('hint_glsxmglsxm2947.html')" style="background: #8e44ad; color: white;">
                <h2>📱 힌트 전광판</h2>
                <p>힌트 제공용</p>

            <div class="card tv-card" onclick="checkTeacher('tv_wjsrhkdvks820.html')" style="background: #2c3e50; color: white;">

                <p>정답 확인용</p>
            </div>
        </div>
        <p style="margin-top: 30px; color: #555; font-size: 1rem;">ⓒ 2026 jeong_sssol </p>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/app.js?v=35"></script>
    <script>
        function checkTeacher(targetUrl) {
            const settings = App.getSettings();
            const adminPassword = settings.adminPassword || "1234"; 
            const pw = prompt("관리자 비밀번호를 입력하세요.");
            if (pw === adminPassword) {
                location.href = targetUrl;
            } else if (pw !== null) {
                alert("비밀번호가 틀렸습니다.");
            }
        }
    </script>
