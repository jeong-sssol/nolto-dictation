<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[정답] 놀토 전광판</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=35">
</head>
<body class="tv-bg">

    <div class="tv-board" id="tv-main">
        <h1 class="tv-round-title" id="tv-round-display">Round 1</h1>
        
        <div id="tv-countdown-number" class="hidden" style="position:fixed; top:50px; right:50px; font-size: 15rem; color: #f1c40f; text-shadow: 8px 8px 0 #d32f2f; font-weight:bold; animation: popIn 1s infinite; z-index:9999;">3</div>

        <div id="tv-word-container" class="tv-words"></div>
        
        <div style="position: fixed; bottom: 20px; right: 20px; display:flex; gap:10px; background:rgba(0,0,0,0.5); padding:10px; border-radius:10px; z-index: 1000; align-items:center;">
            <input type="file" id="audio-upload" accept="audio/*" style="color:white; font-size:1rem; width:200px;">
            <audio id="tv-audio-player" controls style="height:40px;"></audio>
        </div>
        
        <div id="tv-init-overlay" onclick="initTVAudio()" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9999; display:flex; justify-content:center; align-items:center; cursor:pointer; flex-direction:column;">
            <div style="font-size: 5rem; color: #f1c40f; text-shadow: 5px 5px 0 #d32f2f; font-weight:bold; animation: popIn 1s infinite;">▶ 화면을 클릭하여 시작!</div>
            <div style="font-size: 2rem; color: white; margin-top:20px;">비프음 및 원격 자동 재생을 위해 필수입니다.</div>
        </div>

    </div>

    <div id="tv-toast" class="hidden" style="position:fixed; top:50px; left:50%; transform:translateX(-50%); background:#e74c3c; color:white; padding:15px 30px; font-size:2rem; font-weight:bold; border-radius:50px; z-index:9999; box-shadow:0 10px 20px rgba(0,0,0,0.5);">
        메시지
    </div>

    <div id="effect-overlay" class="effect-overlay hidden"><div id="effect-content" class="effect-content"></div></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/app.js?v=35"></script>
    <script src="js/tv_app.js?v=35"></script>
</body>
</html>
