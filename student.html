<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>[학생] 놀토 받쓰</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=36">
</head>
<body>
    <div id="login-modal" class="modal active">
        <div class="modal-content">
            <h2>학생 입장</h2>
            <select id="group-select"></select>
            <input type="text" id="group-pw" placeholder="모둠 비밀번호">
            <input type="text" id="student-name" placeholder="이름/별명">
            <button onclick="joinGroup()">입장하기</button>
        </div>
    </div>

    <!-- 🌟 학생 힌트 주문창 -->
    <div id="hint-modal" class="modal hidden">
        <div class="modal-content" style="width: 500px;">
            <h2 style="color: #1976d2;">🛎️ 힌트 요청하기</h2>
            <p id="hint-status-msg" style="font-weight:bold; color:#e74c3c; font-size:1.2rem;"></p>
            
            <div id="hint-options-container" style="display:flex; flex-direction:column; gap:10px; margin-top:20px;">
                <button id="btn-hint-전체 띄어쓰기" onclick="handleHintClick('전체 띄어쓰기')" style="background:#27ae60;">전체 띄어쓰기</button>
                <button id="btn-hint-한 글자 보기" onclick="handleHintClick('한 글자 보기')" style="background:#8e44ad;">한 글자 보기</button>
                <button id="btn-hint-초성 2개 보기" onclick="handleHintClick('초성 2개 보기')" style="background:#f39c12;">초성 2개 보기</button>
                <button id="btn-hint-3초 보기" onclick="handleHintClick('3초 보기')" style="background:#e74c3c;">전체 n초 보기</button>
                <button id="btn-hint-오답수 알려주기" onclick="handleHintClick('오답수 알려주기')" style="background:#34495e;">오답수 알려주기</button>
            </div>
            
            <button onclick="closeHintModal()" style="margin-top:20px; background:#95a5a6;">창 닫기</button>
        </div>
    </div>

    <div id="student-main" class="hidden">
        <header class="header" style="white-space: nowrap; min-width: 1000px; margin: 0 auto;">
            <div class="header-left" style="display: flex; align-items: center; gap: 10px; white-space: nowrap;">
                <h2 id="group-title" style="margin: 0; font-size: 1.6rem;"></h2>
                <button id="btn-edit-name" class="hidden" onclick="editGroupName()" style="background:#f1c40f; border:none; padding:5px 8px; border-radius:5px; cursor:pointer; font-size:1rem;">✏️ 이름 변경</button>
                <span id="my-name-display" style="font-size:1.1rem; color:#555;"></span>
                <span id="master-badge" class="badge hidden">👑 방장(제출자)</span>
                <button id="btn-hint" class="hidden" onclick="openHintModal()" style="background:#1abc9c; color:white; font-weight:bold; margin-left:10px; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size:1.1rem;">🛎️ 힌트 요청</button>
            </div>

            <div class="header-center" style="display: flex; align-items: center; justify-content: center; gap: 20px; white-space: nowrap; flex: 1;">
                <span id="round-display" style="font-size: 1.8rem; color: #d32f2f; font-weight: bold;"></span>
                <span id="timer-display" style="font-size: 2.5rem; color: #1976d2; font-weight: bold; font-variant-numeric: tabular-nums;">⏱️ --:--</span>
            </div>

            <div class="header-right" style="display: flex; align-items: center; gap: 15px; white-space: nowrap;">
                <div class="view-control" style="display:flex; align-items:center;">
                    <label style="margin-right:5px; font-size: 1.1rem;">👀 보기:</label>
                    <select id="view-select" class="wide-dropdown" onchange="changeView()" style="min-width:130px;">
                        <option value="me">내 화면 작성하기</option>
                    </select>
                </div>

                <div id="transfer-panel" class="master-control hidden" style="display:flex; align-items:center; border-left: 2px solid #ccc; padding-left: 15px;">
                    <label style="margin-right:5px; font-size: 1.1rem;">👑 권한:</label>
                    <select id="member-list" class="wide-dropdown" style="min-width:100px;"></select>
                    <button onclick="transferMaster()" style="margin-left:5px; background:#3498db; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-size: 1.1rem;">넘기기</button>
                </div>
            </div>
        </header>

        <div class="toolbar" style="min-width: 1000px; margin: 0 auto; display: flex; justify-content: center;">
            <div style="display: flex; gap:10px;">
                <button id="btn-pen" class="active" onclick="setMode('pen')">🖊️ 펜</button>
                <button id="btn-eraser" onclick="setMode('eraser')">🧽 지우개</button>
                <button id="btn-text" onclick="setMode('text')">⌨️ 텍스트(T)</button>
                <button onclick="clearBoard()">🗑️ 받쓰판 지우기</button>
            </div>
            
            <div class="tool-settings" style="margin-left:20px;">
                <label>색상: <input type="color" id="color-picker" value="#ffffff"></label>
                <label>크기: <input type="range" id="size-picker" min="2" max="50" value="5"></label>
            </div>
        </div>

        <div class="board-container">
            <canvas id="drawing-board" width="1000" height="562"></canvas>
            <textarea id="text-board" class="hidden" placeholder="정답을 타이핑하세요..."></textarea>
            
            <img id="shared-board" class="hidden" src="" alt="공유화면">
            <div id="shared-text" class="hidden board-text-overlay"></div>
            <div id="read-only-msg" class="hidden" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.7); color:white; padding:10px; border-radius:5px; z-index:100;">👀 관전 모드 (읽기 전용)</div>
            
            <div id="lock-overlay" class="lock-overlay hidden">
                <div class="lock-message">
                    <span style="font-size: 5rem;">🔒</span><br>
                    작성 시간이 종료되었거나 선생님이 화면을 잠갔습니다.
                </div>
            </div>
        </div>
    </div>

    <div id="effect-overlay" class="effect-overlay hidden"><div id="effect-content" class="effect-content"></div></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/app.js?v=36"></script>

    <script>
        let myGroup = '', myName = '', isMaster = false, isDrawing = false, mode = 'pen';
        let viewTarget = 'me'; 
        let timerInterval = null;
        let lastEffectTs = 0; let lastClearTs = 0;
        let myPendingHintReqId = null; 
        let sendTimer = null; // 🌟 텍스트 입력 트래픽 제어용 디바운스 타이머

        const defaultHintColors = {
            '전체 띄어쓰기': '#27ae60', '한 글자 보기': '#8e44ad', 
            '초성 2개 보기': '#f39c12', '3초 보기': '#e74c3c', '오답수 알려주기': '#34495e'
        };

        const canvas = document.getElementById('drawing-board');
        const ctx = canvas.getContext('2d');
        const textBoard = document.getElementById('text-board');
        
        ctx.lineCap = 'round'; ctx.lineJoin = 'round';

        document.getElementById('color-picker').addEventListener('input', updateToolSettings);
        document.getElementById('size-picker').addEventListener('input', updateToolSettings);
        
        function updateToolSettings() {
            ctx.strokeStyle = document.getElementById('color-picker').value;
            ctx.lineWidth = document.getElementById('size-picker').value;
            textBoard.style.color = document.getElementById('color-picker').value;
            textBoard.style.fontSize = (document.getElementById('size-picker').value * 2 + 30) + 'px';
            forceSendRealTimeData();
        }

        window.onload = () => {
            const settings = App.getSettings();
            const select = document.getElementById('group-select');
            for(let i=1; i<=settings.groupCount; i++) {
                select.innerHTML += `<option value="${i}">${i} 모둠</option>`;
            }
            updateToolSettings();
        };

        function joinGroup() {
            myGroup = document.getElementById('group-select').value;
            myName = document.getElementById('student-name').value.trim();
            const pw = document.getElementById('group-pw').value;
            const settings = App.getSettings();

            if (!myName) { alert('이름을 입력하세요.'); return; }
            if (settings.passwords[myGroup] && settings.passwords[myGroup] !== pw) {
                alert('비밀번호가 틀렸습니다.'); return;
            }

            App.joinMember(myGroup, myName);
            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('student-main').classList.remove('hidden');
            syncUI();
        }

        function editGroupName() {
            const newName = prompt("우리 모둠의 새 이름을 정해주세요!");
            if (newName !== null && newName.trim() !== "") App.setGroupName(myGroup, newName.trim());
        }

        function openHintModal() {
            const settings = App.getSettings();
            const groupData = App.getGroup(myGroup);
            const limit = settings.hintLimit || 1;
            const hSec = settings.hintDuration || 3;
            const usedHints = groupData.usedHints || [];
            const allReqs = App.getHintRequests();
            
            let pendingCount = 0;
            let myPendingReqs = {};

            for (let reqId in allReqs) {
                if (allReqs[reqId].group == myGroup && allReqs[reqId].status === 'pending') {
                    myPendingReqs[allReqs[reqId].type] = reqId;
                    pendingCount++;
                }
            }
            
            const totalUsed = (groupData.hintCount || 0) + pendingCount;
            document.getElementById('hint-status-msg').innerText = `현재 힌트 사용 현황: ${totalUsed} / ${limit}회 (대기 포함)`;
            
            const hintTypes = ['전체 띄어쓰기', '한 글자 보기', '초성 2개 보기', '3초 보기', '오답수 알려주기'];
            hintTypes.forEach((type) => {
                const btn = document.getElementById(`btn-hint-${type}`);
                let dispText = type === '3초 보기' ? `전체 ${hSec}초 보기` : type;
                
                if (myPendingReqs[type]) {
                    btn.style.opacity = '1'; 
                    btn.style.background = '#c0392b'; 
                    btn.innerText = `⏳ ${dispText} 대기 중 (클릭 시 취소)`;
                    btn.onclick = () => { cancelMyHint(myPendingReqs[type]); };
                } else if(usedHints.includes(type)) {
                    btn.style.opacity = '0.5'; 
                    btn.style.background = defaultHintColors[type];
                    btn.innerText = `${dispText} (사용완료)`;
                    btn.onclick = () => { alert("이미 사용한 힌트입니다."); };
                } else {
                    btn.style.opacity = '1'; 
                    btn.style.background = defaultHintColors[type];
                    btn.innerText = dispText;
                    btn.onclick = () => { submitNewHint(type, totalUsed, limit); };
                }
            });

            document.getElementById('hint-modal').classList.remove('hidden');
        }

        function closeHintModal() { document.getElementById('hint-modal').classList.add('hidden'); }

        function submitNewHint(hintType, totalUsed, limit) {
            if (totalUsed >= limit) {
                return alert(`❌ 배정된 힌트 횟수(${limit}회)를 모두 사용했습니다. (선생님이 추가 기회를 주시면 쓸 수 있습니다!)`);
            }
            
            let param = '';
            if (hintType === '한 글자 보기') {
                param = prompt("몇 번 글자를 보시겠습니까? (숫자 1개만 입력)");
                if (!param) return alert("요청이 취소되었습니다.");
                param = param.trim();
                if (!/^\d+$/.test(param)) {
                    return alert("❌ 띄어쓰기나 기호 없이 숫자 딱 하나만 입력해주세요! (예: 5)");
                }
            } else if (hintType === '초성 2개 보기') {
                param = prompt("초성을 확인할 두 글자의 번호를 쉼표로 구분하여 입력하세요.\n(예: 3, 5)");
                if (!param) return alert("입력이 취소되었습니다.");
                let parts = param.split(',').map(s => s.trim()).filter(s => s !== '');
                if (parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) {
                    return alert("❌ 쉼표(,)를 기준으로 숫자 딱 두 개만 입력해주세요! (예: 3, 5)");
                }
            }

            const reqId = App.orderHint(myGroup, hintType, param);
            myPendingHintReqId = reqId;
            
            alert(`✅ 힌트 요청이 선생님께 전송되었습니다!`);
            openHintModal(); 
        }

        function cancelMyHint(reqId) {
            if(confirm("이 힌트 요청을 취소하시겠습니까? 차감된 횟수가 복구됩니다.")) {
                App.cancelHint(reqId);
                alert("취소되었습니다.");
                openHintModal();
            }
        }

        function setMode(newMode) {
            mode = newMode;
            document.querySelectorAll('.toolbar button').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            
            if (mode === 'text') {
                canvas.style.pointerEvents = 'none'; textBoard.classList.remove('hidden');
            } else {
                canvas.style.pointerEvents = 'auto'; textBoard.classList.add('hidden');
                ctx.globalCompositeOperation = (mode === 'eraser') ? 'destination-out' : 'source-over';
            }
            forceSendRealTimeData();
        }

        canvas.addEventListener('mousedown', (e) => { if(viewTarget === 'me' && !isBoardLocked()) { isDrawing = true; draw(e); } });
        canvas.addEventListener('mousemove', draw);
        // 🌟 마우스 업 시에만 전송하여 트래픽 보호
        window.addEventListener('mouseup', () => { if(isDrawing) { isDrawing = false; ctx.beginPath(); forceSendRealTimeData(); } });
        
        // 🌟 타자 칠때 트래픽 폭탄 방지 (디바운싱 적용)
        textBoard.addEventListener('keyup', () => {
            clearTimeout(sendTimer);
            sendTimer = setTimeout(forceSendRealTimeData, 300);
        });

        canvas.addEventListener('touchstart', (e) => { if(viewTarget === 'me' && !isBoardLocked()) { isDrawing = true; draw(e.touches[0]); } }, {passive:true});
        canvas.addEventListener('touchmove', (e) => { draw(e.touches[0]); }, {passive:true});
        window.addEventListener('touchend', () => { if(isDrawing) { isDrawing = false; ctx.beginPath(); forceSendRealTimeData(); } });

        function draw(e) {
            if (!isDrawing || viewTarget !== 'me' || isBoardLocked()) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;
            
            ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x, y);
        }

        function clearBoard() {
            if (viewTarget !== 'me') return alert("내 받쓰판일 때만 지울 수 있습니다.");
            if (isBoardLocked()) return alert("현재 작성 시간이 종료되었거나 잠금 상태입니다.");
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            textBoard.value = '';
            forceSendRealTimeData();
        }

        function forceSendRealTimeData() {
            if (viewTarget !== 'me' || isBoardLocked()) return;
            const data = (mode === 'text') ? textBoard.value : canvas.toDataURL('image/png');
            App.updateMemberBoard(myGroup, myName, { type: mode, data: data, color: document.getElementById('color-picker').value, size: document.getElementById('size-picker').value });
        }

        function changeView() { viewTarget = document.getElementById('view-select').value; renderView(); }

        function transferMaster() {
            const target = document.getElementById('member-list').value;
            if (target && target !== myName) {
                App.setMaster(myGroup, target);
                alert(`✅ [${target}] 학생에게 방장 권한을 넘겼습니다.`);
            }
        }

        window.addEventListener('app-sync', syncUI);
        
        function syncUI() {
            if(!myGroup) return;
            const groupData = App.getGroup(myGroup);
            const settings = App.getSettings();
            
            isMaster = (groupData.master === myName);
            
            if (settings.clearTrigger && settings.clearTrigger > lastClearTs) {
                lastClearTs = settings.clearTrigger;
                ctx.clearRect(0, 0, canvas.width, canvas.height); textBoard.value = '';
            }

            if(myPendingHintReqId) {
                const reqs = App.getHintRequests();
                if(!reqs[myPendingHintReqId] || reqs[myPendingHintReqId].status !== 'pending') {
                    myPendingHintReqId = null; 
                    if(!document.getElementById('hint-modal').classList.contains('hidden')) openHintModal();
                }
            }
            
            const customName = groupData.customName ? ` <span style="color:#e67e22">[${groupData.customName}]</span>` : '';
            document.getElementById('group-title').innerHTML = `${myGroup}조${customName}`;
            document.getElementById('my-name-display').innerText = `${myName}`;
            document.getElementById('round-display').innerText = `🔥 ${settings.currentRound}라운드`;

            const viewSelect = document.getElementById('view-select');
            const memberSelect = document.getElementById('member-list');
            
            let viewHtml = `<option value="me">👉 받쓰판 작성하기</option>`;
            let memberHtml = '';

            const safeMembers = Array.isArray(groupData.members) ? groupData.members : Object.keys(groupData.members || {});

            safeMembers.forEach(m => {
                if(m !== myName) {
                    viewHtml += `<option value="${m}">${(m === groupData.master) ? `👑 ${m} (방장)` : `👀 ${m}`}</option>`;
                    memberHtml += `<option value="${m}">${m}</option>`;
                }
            });

            // 🌟 드롭다운 깜빡임 & 닫힘 현상 원천 차단 (내용이 바뀔때만 업데이트)
            if (viewSelect.innerHTML !== viewHtml) {
                let currentVal = viewSelect.value;
                viewSelect.innerHTML = viewHtml;
                viewSelect.value = currentVal || 'me';
            }
            if (memberSelect.innerHTML !== memberHtml) {
                let currentVal = memberSelect.value;
                memberSelect.innerHTML = memberHtml;
                if(currentVal) memberSelect.value = currentVal;
            }
            
            if (isMaster) {
                document.getElementById('master-badge').classList.remove('hidden');
                document.getElementById('btn-edit-name').classList.remove('hidden');
                document.getElementById('btn-hint').classList.remove('hidden'); 
                document.getElementById('transfer-panel').classList.remove('hidden');
            } else {
                document.getElementById('master-badge').classList.add('hidden');
                document.getElementById('btn-edit-name').classList.add('hidden');
                document.getElementById('btn-hint').classList.add('hidden'); 
                document.getElementById('transfer-panel').classList.add('hidden');
            }
            renderView(); manageTimerAndLock(settings); checkEffects(settings);
        }

        function isBoardLocked() {
            const settings = App.getSettings();
            if (settings.isLocked) return true;
            if (settings.timerEnd) return (settings.timerEnd - Date.now()) <= 0;
            return false;
        }

        function manageTimerAndLock(settings) {
            clearInterval(timerInterval); updateTimerDisplay();
            if (settings.timerEnd) timerInterval = setInterval(updateTimerDisplay, 500);
        }

        function updateTimerDisplay() {
            const settings = App.getSettings();
            let timeText = "--:--"; let lockedByTimer = false;

            if (settings.timerEnd) {
                const left = Math.floor((settings.timerEnd - Date.now()) / 1000);
                if (left <= 0) {
                    timeText = "00:00"; lockedByTimer = true; clearInterval(timerInterval);
                    App.playAlarm();
                } else {
                    timeText = `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(left % 60).padStart(2, '0')}`;
                }
            }
            document.getElementById('timer-display').innerText = `⏱️ ${timeText}`;

            const lockOverlay = document.getElementById('lock-overlay');
            if (settings.isLocked || lockedByTimer) {
                lockOverlay.classList.remove('hidden'); canvas.style.pointerEvents = 'none'; textBoard.disabled = true;
            } else {
                lockOverlay.classList.add('hidden');
                if (viewTarget === 'me') {
                    canvas.style.pointerEvents = (mode === 'text') ? 'none' : 'auto'; textBoard.disabled = false;
                }
            }
        }

        function renderView() {
            if(!myGroup) return;
            const groupData = App.getGroup(myGroup);
            const sharedImg = document.getElementById('shared-board');
            const sharedText = document.getElementById('shared-text');
            const readOnlyMsg = document.getElementById('read-only-msg');

            if (viewTarget === 'me') {
                canvas.style.opacity = '1'; textBoard.style.opacity = '1';
                canvas.style.pointerEvents = (mode === 'text') ? 'none' : 'auto'; textBoard.disabled = false;
                sharedImg.classList.add('hidden'); sharedText.classList.add('hidden'); readOnlyMsg.classList.add('hidden');
            } else {
                canvas.style.opacity = '0'; textBoard.style.opacity = '0';
                canvas.style.pointerEvents = 'none'; textBoard.disabled = true;
                readOnlyMsg.classList.remove('hidden');

                const membersDataObj = groupData.membersData || {};
                const targetData = membersDataObj[viewTarget] || { type: 'pen', data: '', color: '#fff', size: 5 };
                
                // 🌟 이미지 깜빡임 방지 (DOM 교체 대신 src 속성만 변경)
                if (targetData.type === 'text') {
                    sharedImg.classList.add('hidden'); sharedText.classList.remove('hidden');
                    sharedText.innerText = targetData.data || ''; sharedText.style.color = targetData.color || '#ffffff';
                    sharedText.style.fontSize = (targetData.size * 2 + 30) + 'px';
                } else {
                    sharedText.classList.add('hidden');
                    if (targetData.data) { 
                        if(sharedImg.src !== targetData.data) sharedImg.src = targetData.data; 
                        sharedImg.classList.remove('hidden'); 
                    }
                    else { 
                        if(sharedImg.src !== '') sharedImg.src = ''; 
                        sharedImg.classList.add('hidden'); 
                    }
                }
            }
        }

        function checkEffects(settings) {
            if (settings.currentEffect && settings.currentEffect.ts > lastEffectTs) {
                lastEffectTs = settings.currentEffect.ts;
                if (settings.currentEffect.type === 'boom' && !settings.currentEffect.targets.includes(parseInt(myGroup))) return;
                playEffect(settings.currentEffect);
            }
        }

        function playEffect(effect) {
            const overlay = document.getElementById('effect-overlay');
            const content = document.getElementById('effect-content');
            overlay.classList.remove('hidden');
            document.querySelectorAll('.particle').forEach(p => p.remove());

            const groupsData = App.getAllGroups();
            let targetNames = effect.targets.map(gId => groupsData[gId] && groupsData[gId].customName ? `${gId}조[${gData.customName}]` : `${gId}조`);

            if (effect.type === 'boom') {
                content.innerHTML = `<div class="boom-text">💥 땡! 오답!<br><span style="color:#f1c40f;">${targetNames.join(', ')}</span></div>`;
                createParticles(['🍿', '💣', '💨'], 50);
            } else if (effect.type === 'oneshot') {
                content.innerHTML = `<div class="oneshot-text">📸 원샷 축하합니다!<br><span style="color:#fff; text-shadow: 2px 2px #d32f2f;">${targetNames.join('<br>')}</span></div>`;
                createParticles(['🎉', '🎊', '✨', '🥇'], 80);
            }

            setTimeout(() => { overlay.classList.add('hidden'); content.innerHTML = ''; }, 5000);
        }

        function createParticles(emojis, count) {
            for(let i=0; i<count; i++) {
                const p = document.createElement('div'); p.className = 'particle';
                p.innerText = emojis[Math.floor(Math.random() * emojis.length)];
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDuration = (Math.random() * 2 + 2) + 's';
                p.style.animationDelay = (Math.random() * 1) + 's';
                p.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 4500); 
            }
        }
    </script>
</body>
</html>
