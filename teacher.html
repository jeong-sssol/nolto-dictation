<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>교사 모드 - 놀토 받쓰</title>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="teacher-bg">
    <!-- 🌟 군더더기를 싹 뺀 초깔끔 상단 헤더 -->
    <header class="teacher-header" style="display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; flex-wrap:wrap; gap:10px;">
        <div style="display:flex; align-items:center; gap:15px;">
            <h1 style="margin:0;">🖥️ 실시간 모니터링</h1>
            <button onclick="toggleSetupModal()" style="background:#34495e; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold; font-size:1.1rem;">⚙️ 기본 세팅</button>
        </div>
        
        <div style="display:flex; align-items:center; gap:20px;">
            <div style="font-size: 1.2rem; font-weight: bold; color:#f1c40f;">
                진행 라운드: <select id="active-round-select" class="wide-dropdown" style="width: 100px; font-weight:bold; font-size:1.1rem; margin-right:15px;" onchange="changeActiveRound()"></select>
            </div>
            
            <div style="display: flex; gap: 5px; align-items: center; background:rgba(0,0,0,0.3); padding:5px 15px; border-radius:10px;">
                <span style="font-size:1.1rem; font-weight:bold;">⏱️ 타이머</span>
                <!-- 🌟 입력창 폭 확장 (60px) -->
                <input type="number" id="timer-min" value="0" min="0" style="width: 60px; font-size:1.1rem; text-align:center;"> 분
                <input type="number" id="timer-sec" value="0" min="0" max="59" style="width: 60px; font-size:1.1rem; text-align:center;"> 초
                <button onclick="startTimer()" style="background: #27ae60; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold;">▶ 시작</button>
                <button onclick="App.stopTimer()" style="background: #7f8c8d; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold;">⏹ 정지</button>
            </div>

            <button id="btn-lock" onclick="toggleLock()" style="padding: 8px 15px; font-size:1.1rem; font-weight:bold; border:none; border-radius:5px; cursor:pointer;"></button>
            <button onclick="toggleSidebar()" style="background: #e67e22; border: none; padding:8px 15px; border-radius:5px; font-size: 1.2rem; cursor: pointer; color:white; font-weight:bold;">🧰 진행 도구</button>
        </div>
    </header>

    <!-- 🌟 타이머 현황 표시줄 (상단 고정) -->
    <div id="teacher-timer-bar" style="background:#e74c3c; color:white; text-align:center; padding:5px; font-size:1.5rem; font-weight:bold; display:none;">
        남은 시간: <span id="teacher-timer-display">00:00</span>
    </div>

    <!-- 🌟 우측 하단 힌트 팝업 종 버튼 -->
    <button class="hint-fab" onclick="toggleActionPanel()">
        🔔 <span id="hint-badge" class="hint-badge hidden">0</span>
    </button>

    <!-- 🌟 우측 하단 힌트 주문 창 (리액션 제거, 순수 힌트만) -->
    <div id="action-pos-panel" class="hint-panel hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid #16a085; padding-bottom:10px; margin-bottom:10px;">
            <div style="font-size: 1.3rem; font-weight: bold;">🛎️ 힌트 요청 내역</div>
            <button onclick="toggleActionPanel()" style="background:transparent; border:none; color:white; font-size:1.5rem; cursor:pointer;">❌</button>
        </div>
        
        <div id="hint-list" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; margin-bottom:5px;">
            <!-- 주문 내역 렌더링 -->
        </div>
    </div>

    <!-- 🌟 우측 슬라이드 사이드바 (리액션, 초기화, 글씨크기 등 진행 도구) -->
    <div id="teacher-sidebar" class="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
            <h2>🛠️ 수업 진행 도구</h2>
            <button onclick="toggleSidebar()" style="background:transparent; border:none; font-size:2rem; cursor:pointer;">❌</button>
        </div>

        <div class="sidebar-section">
            <h3 style="color:#e74c3c;">🎉 리액션 발사</h3>
            <!-- 🌟 조 이름 제거, 숫자만 깔끔하게 -->
            <div id="effect-checkboxes" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; font-size:1.2rem; margin-bottom: 10px;"></div>
            <div style="display:flex; gap:10px;">
                <button onclick="triggerEffect('boom')" style="background:#e74c3c; color:white; flex:1;">🍿 오답 강냉이</button>
                <button onclick="triggerEffect('oneshot')" style="background:#3498db; color:white; flex:1;">📸 원샷 송출</button>
            </div>
        </div>
        
        <div class="sidebar-section">
            <h3 style="color:#27ae60;">💡 힌트 및 칠판 제어</h3>
            
            <label style="display:block; margin-bottom:10px;">라운드당 힌트 기회: 
                <input type="number" id="set-hint-limit" value="1" style="width:60px;" onchange="App.saveSettingsOnly()">
            </label>
            <button onclick="resetAllHints()" style="background:#8e44ad; color:white; width:100%; margin-bottom:15px;">🔄 이번 라운드 힌트 횟수 리셋</button>

            <!-- 🌟 CCTV 폰트 사이즈 조절 복구 -->
            <label style="display:block; margin-bottom:5px;">CCTV 글자 크기: <span id="font-size-val"></span>px</label>
            <input type="range" id="cctv-font-size" min="15" max="60" value="30" onchange="App.saveSettingsOnly(); renderCCTV();" style="width:100%; margin-bottom:15px;">

            <button onclick="App.triggerClearAll(); App.clearAllBoards(); alert('모든 학생 화면이 지워졌습니다.');" style="background: #e67e22; color:white; width:100%;">🧽 전체 학생 받쓰판 지우기</button>
        </div>
    </div>
    <div id="sidebar-overlay" class="sidebar-overlay hidden" onclick="toggleSidebar()"></div>

    <!-- ⚙️ 기초 셋팅용 모달 (수업 전 1회용) -->
    <div id="setup-modal" class="modal hidden">
        <div class="modal-content" style="width: 700px; max-height:90vh; overflow-y:auto;">
            <h2 style="color: #1976d2;">⚙️ 기초 수업 셋팅(수업 전 확인)</h2>
            <div class="setting-row" style="background:#f4f1ea; padding:15px; border-radius:10px;">
                <label>교사 비밀번호: <input type="text" id="set-admin-pw" style="width:100px;"></label>
                <label>모둠 수: <input type="number" id="set-groups" min="1" max="10" style="width:70px;" onchange="renderDynamicInputs()"></label>
                <label>총 라운드: <input type="number" id="set-total-rounds" min="1" max="10" style="width:70px;" onchange="renderDynamicInputs()"></label>
            </div>

            <h3 style="margin-top:15px; color:#27ae60;">라운드별 정답 세팅 (띄어쓰기 무시)</h3>
            <div id="answers-container" style="display:flex; flex-direction:column; gap:5px; width:100%; align-items:center;"></div>

            <h3 style="margin-top:15px; color:#e67e22;">모둠별 비밀번호</h3>
            <div id="group-pw-container" class="setting-row" style="flex-wrap: wrap; justify-content:center;"></div>

            <div style="display:flex; gap:10px; margin-top:20px;">
                <button onclick="saveModalSettings()" style="background:#27ae60; flex:1;">저장 후 닫기</button>
                <button onclick="toggleSetupModal()" style="background:#95a5a6; flex:1;">취소</button>
            </div>
            
            <button onclick="resetAllData()" style="width:100%; margin-top:20px; background:#e74c3c;">🚨 모든 데이터 리셋 (새수업)</button>
        </div>
    </div>

    <!-- 🌟 CCTV 모니터링 그리드 -->
    <div class="cctv-grid" id="cctv-container"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/app.js"></script>

    <script>
        const cctvContainer = document.getElementById('cctv-container');
        let unreadHints = 0;
        let teacherTimerInterval = null;

        window.onload = () => {
            const settings = App.getSettings();
            document.getElementById('set-admin-pw').value = settings.adminPassword || '1234';
            document.getElementById('set-groups').value = settings.groupCount;
            document.getElementById('set-total-rounds').value = settings.totalRounds || 3;
            document.getElementById('set-hint-limit').value = settings.hintLimit || 1;
            document.getElementById('cctv-font-size').value = settings.teacherFontSize || 30;
            
            renderDynamicInputs(settings.passwords, settings.answers);
            updateDashboardControls();
            renderCCTV();
            setInterval(checkHintTimeout, 5000); 
        };

        function toggleSidebar() {
            document.getElementById('teacher-sidebar').classList.toggle('open');
            document.getElementById('sidebar-overlay').classList.toggle('hidden');
        }

        function toggleSetupModal() {
            document.getElementById('setup-modal').classList.toggle('hidden');
        }

        function toggleActionPanel() {
            document.getElementById('action-pos-panel').classList.toggle('hidden');
        }

        function renderDynamicInputs(existingPws = {}, existingAns = {}) {
            const groupCount = parseInt(document.getElementById('set-groups').value);
            const roundCount = parseInt(document.getElementById('set-total-rounds').value);
            
            const pwContainer = document.getElementById('group-pw-container');
            let pwHtml = '';
            for(let i=1; i<=groupCount; i++) {
                pwHtml += `<label style="margin:5px;">${i}조: <input type="text" id="pw-${i}" value="${existingPws[i]||''}" style="width:60px; padding:5px;"></label>`;
            }
            pwContainer.innerHTML = pwHtml;

            const ansContainer = document.getElementById('answers-container');
            let ansHtml = '';
            for(let i=1; i<=roundCount; i++) {
                ansHtml += `<div style="width:100%;"><label>${i}R: <input type="text" id="ans-${i}" value="${existingAns[i]||''}" style="width:80%; padding:5px;"></label></div>`;
            }
            ansContainer.innerHTML = ansHtml;

            // 🌟 리액션 체크박스 이름 숫자만 나오게
            const effContainer = document.getElementById('effect-checkboxes');
            let effHtml = '';
            for(let i=1; i<=groupCount; i++) {
                effHtml += `<label style="cursor:pointer; white-space:nowrap; padding:5px; background:#f4f1ea; border-radius:5px;"><input type="checkbox" name="eff-group" value="${i}" style="transform:scale(1.3); margin-right:5px;"> ${i}조</label>`;
            }
            effContainer.innerHTML = effHtml;
        }

        function saveModalSettings() {
            const adminPw = document.getElementById('set-admin-pw').value;
            const groupCount = parseInt(document.getElementById('set-groups').value);
            const totalRounds = parseInt(document.getElementById('set-total-rounds').value);
            const hintLimit = parseInt(document.getElementById('set-hint-limit').value) || 1;
            const tFontSize = document.getElementById('cctv-font-size').value;
            
            let passwords = {};
            for(let i=1; i<=groupCount; i++) passwords[i] = document.getElementById(`pw-${i}`).value;
            let answers = {};
            for(let i=1; i<=totalRounds; i++) answers[i] = document.getElementById(`ans-${i}`).value;
            
            App.saveSettings(adminPw, groupCount, passwords, totalRounds, answers, hintLimit, tFontSize);
            alert("초기 설정이 저장되었습니다.");
            toggleSetupModal();
            updateDashboardControls();
            renderCCTV();
        }

        function resetAllData() {
            if(confirm("모든 모둠 데이터와 설정이 초기화됩니다. 계속할까요?")) {
                App.factoryReset();
                setTimeout(() => location.reload(), 500);
            }
        }

        function updateDashboardControls() {
            const settings = App.getSettings();
            const roundSelect = document.getElementById('active-round-select');
            roundSelect.innerHTML = '';
            for(let i=1; i<=settings.totalRounds; i++) {
                roundSelect.innerHTML += `<option value="${i}">${i} 라운드 채점</option>`;
            }
            roundSelect.value = settings.currentRound;

            const btnLock = document.getElementById('btn-lock');
            if (settings.isLocked) {
                btnLock.innerText = '🔒 받쓰판 잠금 해제';
                btnLock.style.background = '#d32f2f';
                btnLock.style.color = 'white';
            } else {
                btnLock.innerText = '🔓 받쓰판 강제 잠금';
                btnLock.style.background = '#f1c40f';
                btnLock.style.color = 'black';
            }

            document.getElementById('set-hint-limit').value = settings.hintLimit || 1;
            document.getElementById('cctv-font-size').value = settings.teacherFontSize || 30;

            renderDynamicInputs(settings.passwords, settings.answers); 
            manageTeacherTimer(settings);
        }

        function changeActiveRound() {
            App.setCurrentRound(parseInt(document.getElementById('active-round-select').value));
        }

        function toggleLock() {
            App.setLock(!App.getSettings().isLocked);
        }

        function startTimer() {
            const m = parseInt(document.getElementById('timer-min').value) || 0;
            const s = parseInt(document.getElementById('timer-sec').value) || 0;
            const totalSec = (m * 60) + s;
            if (totalSec > 0) App.startTimer(totalSec);
            else alert("시간을 설정해주세요.");
        }

        function manageTeacherTimer(settings) {
            clearInterval(teacherTimerInterval);
            const bar = document.getElementById('teacher-timer-bar');
            const display = document.getElementById('teacher-timer-display');

            if (settings.timerEnd) {
                bar.style.display = 'block';
                teacherTimerInterval = setInterval(() => {
                    const left = Math.floor((settings.timerEnd - Date.now()) / 1000);
                    if (left <= 0) {
                        display.innerText = "00:00";
                        bar.style.background = "#c0392b";
                        clearInterval(teacherTimerInterval);
                        App.playAlarm(); 
                    } else {
                        bar.style.background = "#e74c3c";
                        const m = String(Math.floor(left / 60)).padStart(2, '0');
                        const s = String(left % 60).padStart(2, '0');
                        display.innerText = `${m}:${s}`;
                    }
                }, 500);
            } else {
                bar.style.display = 'none';
            }
        }

        function triggerEffect(type) {
            const checkboxes = document.querySelectorAll('input[name="eff-group"]:checked');
            if(checkboxes.length === 0) return alert("대상을 선택해주세요.");
            const targets = Array.from(checkboxes).map(cb => parseInt(cb.value));
            App.triggerEffect(type, targets);
            alert(`이벤트 전송 완료!`);
            checkboxes.forEach(cb => cb.checked = false);
            toggleSidebar(); // 쏜 후 사이드바 닫기
        }

        function resetAllHints() {
            if(confirm("이번 라운드 힌트 요청 내역과 차감 횟수를 리셋합니다.")) {
                App.resetAllHints();
                alert("리셋 완료!");
            }
        }

        // 🌟 힌트 주문 관리 로직 (거절 버튼 삭제)
        function renderHintQueue() {
            const hints = App.getHintRequests();
            const list = document.getElementById('hint-list');
            const badge = document.getElementById('hint-badge');
            
            let pendingCount = 0;
            list.innerHTML = '';

            for(let key in hints) {
                if (hints[key].status === 'pending') {
                    pendingCount++;
                    const secs = Math.floor((Date.now() - hints[key].ts) / 1000);
                    const timeColor = secs > 60 ? '#e74c3c' : '#bdc3c7';
                    
                    list.innerHTML += `
                        <div style="background: rgba(0,0,0,0.3); padding: 10px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center;">
                            <div style="font-size:1.1rem;">
                                <strong>${hints[key].group}조</strong> [${hints[key].type}] 
                                <span style="font-size:0.9rem; color:${timeColor};">(${secs}초전)</span>
                            </div>
                            <button onclick="App.processHint('${key}', 'approved'); alert('확인 및 TV 송출 완료!');" style="background:#2ecc71; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">✅ 확인 및 송출</button>
                        </div>
                    `;
                }
            }

            badge.innerText = pendingCount;
            if(pendingCount > 0) {
                badge.classList.remove('hidden');
                if(pendingCount > unreadHints) document.getElementById('action-pos-panel').classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
                if(list.innerHTML === '') list.innerHTML = '<div style="text-align:center; color:#ccc;">대기 중인 힌트가 없습니다.</div>';
            }
            unreadHints = pendingCount;
        }

        function checkHintTimeout() {
            const hints = App.getHintRequests();
            const now = Date.now();
            for(let key in hints) {
                if(hints[key].status === 'pending' && (now - hints[key].ts > 60000) && !hints[key].alerted) {
                    alert(`🚨 [${hints[key].group}모둠] 힌트 주문이 1분 이상 지연되었습니다!`);
                    App.markHintAlerted(key);
                }
            }
        }

        window.addEventListener('app-sync', () => {
            updateDashboardControls();
            renderCCTV();
            renderHintQueue();
        });

        // 🌟 CCTV 렌더링 (비율 고정 및 단어 줄바꿈 방지 적용)
        function renderCCTV() {
            const settings = App.getSettings();
            const groups = App.getAllGroups();
            const tFontSize = settings.teacherFontSize || 30; 
            const currentAns = settings.answers[settings.currentRound] || '';
            
            document.getElementById('font-size-val').innerText = tFontSize;

            cctvContainer.innerHTML = '';

            for (let i = 1; i <= settings.groupCount; i++) {
                const gData = groups[i] || { master: '', membersData: {}, customName: '', hintCount:0 };
                const masterName = gData.master;
                const mData = gData.membersData[masterName] || { type: 'pen', data: '', color: '#ffffff' };
                const hintUsedText = gData.hintCount > 0 ? ` (💡${gData.hintCount}회)` : '';
                
                const grade = App.gradeAnswer(currentAns, mData.data);
                
                let boardContent = '';
                if (mData.type === 'text') {
                    // 🌟 텍스트 오버레이에 줄바꿈 완벽 적용
                    boardContent = `<div class="board-text-overlay" style="font-size:${tFontSize}px; color:${mData.color || '#fff'}; word-break: break-all; white-space: pre-wrap;">${mData.data}</div>`;
                } else if (mData.data) {
                    boardContent = `<img src="${mData.data}" style="width:100%; height:100%; object-fit:contain;">`;
                }

                const customNameDisplay = gData.customName ? ` <span style="color:#e67e22">[${gData.customName}]</span>` : '';

                cctvContainer.innerHTML += `
                    <div class="cctv-card">
                        <h3 style="margin:5px 0;">${i} 조${customNameDisplay}${hintUsedText} <span style="font-size:1.1rem; color:#d32f2f;">(방장: ${masterName || '없음'})</span></h3>
                        <div class="cctv-board">${boardContent}</div>
                        <div class="correct-rate" style="color: ${grade.rate === 100 ? '#27ae60' : '#d32f2f'}">
                            ${currentAns ? `정답률: ${grade.rate}% (${grade.correctCount}/${grade.totalCount})` : '정답 미입력 (자동채점 대기)'}
                        </div>
                        <div style="font-size:1.2rem; font-weight:bold; margin-top:5px; word-break: break-all; white-space: pre-wrap;">${grade.html}</div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
